# Copy .env.example to .env and fill it in, then: docker compose up -d
services:
  antivpn:
    image: ghcr.io/rainnny7/antivpn:latest
    build: .
    container_name: antivpn
    restart: unless-stopped
    ports:
      - "7500:7500"
    environment:
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      DATABASE_URL: jdbc:mariadb://mariadb:3306/antivpn
      DATABASE_USERNAME: antivpn
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      MAXMIND_ACCOUNT_ID: ${MAXMIND_ACCOUNT_ID:-}
      MAXMIND_LICENSE: ${MAXMIND_LICENSE:-}
      INFLUXDB_URL: ${INFLUXDB_URL:-}
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN:-}
      INFLUXDB_ORG: ${INFLUXDB_ORG:-}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET:-}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      DISCORD_USERNAME: ${DISCORD_USERNAME:-AntiVPN}
      DISCORD_MIN_RISK: ${DISCORD_MIN_RISK:-0}
    volumes:
      - ./data/app:/app/data
      - ./data/maxmind:/app/maxmind
      # - ./application.yml:/app/config/application.yml:ro # Optional overrides
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy

  mariadb:
    image: mariadb:11.4
    container_name: antivpn-mariadb
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: antivpn
      MARIADB_USER: antivpn
      MARIADB_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - ./data/mariadb:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: antivpn-redis
    restart: unless-stopped
    command: [ "redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru" ]
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10
