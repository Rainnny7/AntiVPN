version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    groups:
      spring:
        patterns: [ 'org.springframework*' ]
      testing:
        patterns: [ 'org.testcontainers*', 'com.h2database*' ]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: [ '*' ]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
